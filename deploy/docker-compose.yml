# Local development stack: PostgreSQL, S3-compatible storage (R2 stand-in), API, workers and web.
#
#   cp deploy/.env.example deploy/.env
#   docker compose -f deploy/docker-compose.yml up -d --build --wait
#
# All settings come from deploy/.env. Staging/production compose files live next to this one (backlog O-1).

name: ss-sport-drive

x-app-environment: &app-environment
  DOTNET_ENVIRONMENT: Development
  ConnectionStrings__Database: Host=postgres;Port=5432;Database=${POSTGRES_DB:?};Username=${POSTGRES_USER:?};Password=${POSTGRES_PASSWORD:?}
  Storage__ServiceUrl: http://storage:9000
  Storage__AccessKey: ${STORAGE_ACCESS_KEY:?}
  Storage__SecretKey: ${STORAGE_SECRET_KEY:?}
  Storage__Bucket: ${STORAGE_BUCKET:?}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10

  # RustFS replaces MinIO: MinIO no longer publishes Docker images. Same S3 API, same console idea.
  storage:
    image: rustfs/rustfs:1.0.3
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${STORAGE_ACCESS_KEY:?}
      RUSTFS_SECRET_KEY: ${STORAGE_SECRET_KEY:?}
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "${STORAGE_PORT:-9000}:9000"
      - "${STORAGE_CONSOLE_PORT:-9001}:9001"
    volumes:
      - storage-data:/data

  # One-shot job: waits for the storage API and creates the bucket if it is missing.
  storage-init:
    image: amazon/aws-cli:2.38.5
    depends_on:
      - storage
    environment:
      AWS_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY:?}
      AWS_SECRET_ACCESS_KEY: ${STORAGE_SECRET_KEY:?}
      AWS_DEFAULT_REGION: us-east-1
      BUCKET: ${STORAGE_BUCKET:?}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for attempt in $$(seq 1 30); do
          aws --endpoint-url http://storage:9000 s3api list-buckets > /dev/null 2>&1 && break
          sleep 1
        done
        aws --endpoint-url http://storage:9000 s3api head-bucket --bucket "$$BUCKET" 2>/dev/null \
          || aws --endpoint-url http://storage:9000 s3api create-bucket --bucket "$$BUCKET"
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: src/SsSport.Drive.Api/Dockerfile
    restart: unless-stopped
    environment:
      <<: *app-environment
      ASPNETCORE_ENVIRONMENT: Development
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully

  workers:
    build:
      context: ..
      dockerfile: src/SsSport.Drive.Workers/Dockerfile
    restart: unless-stopped
    environment:
      <<: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully

  web:
    build:
      context: ../web
    restart: unless-stopped
    environment:
      API_BASE_URL: http://api:8080
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  storage-data:
