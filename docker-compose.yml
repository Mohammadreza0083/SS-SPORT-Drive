# Local development stack: PostgreSQL, S3-compatible storage (R2 stand-in), API, workers and web.
#
#   cp .env.example .env      # once, then fill in
#   docker compose up -d --build --wait
#
# Every setting comes from the root .env. Host ports are bound to 127.0.0.1 only, so nothing
# is reachable from other machines. Staging/production compose files live in deploy/ (backlog O-1).

name: ss-sport-drive

x-app: &app
  restart: unless-stopped
  # Telegram, email, R2 and CORS settings go straight from .env to the apps.
  env_file: .env
  depends_on:
    postgres:
      condition: service_healthy
    storage-init:
      condition: service_completed_successfully

# Inside Docker the apps reach PostgreSQL and storage by service name, not localhost.
x-app-environment: &app-environment
  DOTNET_ENVIRONMENT: Development
  ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${DB_NAME:?};Username=${DB_USER:?};Password=${DB_PASSWORD:?}
  Storage__ServiceUrl: http://storage:9000

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?}
      POSTGRES_USER: ${DB_USER:?}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10

  # RustFS replaces MinIO: MinIO no longer publishes Docker images. Same S3 API, same console idea.
  storage:
    image: rustfs/rustfs:1.0.3
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${Storage__AccessKey:?}
      RUSTFS_SECRET_KEY: ${Storage__SecretKey:?}
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "127.0.0.1:${STORAGE_PORT:-9000}:9000"
      - "127.0.0.1:${STORAGE_CONSOLE_PORT:-9001}:9001"
    volumes:
      - storage-data:/data

  # One-shot job: waits for the storage API and creates the bucket if it is missing.
  storage-init:
    image: amazon/aws-cli:2.38.5
    depends_on:
      - storage
    environment:
      AWS_ACCESS_KEY_ID: ${Storage__AccessKey:?}
      AWS_SECRET_ACCESS_KEY: ${Storage__SecretKey:?}
      AWS_DEFAULT_REGION: us-east-1
      BUCKET: ${Storage__Bucket:?}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for attempt in $$(seq 1 30); do
          aws --endpoint-url http://storage:9000 s3api list-buckets > /dev/null 2>&1 && break
          sleep 1
        done
        aws --endpoint-url http://storage:9000 s3api head-bucket --bucket "$$BUCKET" 2>/dev/null \
          || aws --endpoint-url http://storage:9000 s3api create-bucket --bucket "$$BUCKET"
    restart: "no"

  api:
    <<: *app
    build:
      context: .
      dockerfile: src/SsSport.Drive.Api/Dockerfile
    environment:
      <<: *app-environment
      ASPNETCORE_ENVIRONMENT: Development
    ports:
      - "127.0.0.1:${API_PORT:-5080}:8080"

  workers:
    <<: *app
    build:
      context: .
      dockerfile: src/SsSport.Drive.Workers/Dockerfile
    environment:
      <<: *app-environment

  web:
    build:
      context: web
    restart: unless-stopped
    environment:
      # Server-side calls from Next.js go over the Docker network.
      API_BASE_URL: http://api:8080
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  storage-data:
