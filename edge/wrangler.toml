# Cloudflare Worker for the SS-SPORT Drive edge: short links and HLS token validation (backlog V-5).
# Routes, R2 bindings and secrets are added when the Cloudflare account is set up (backlog S-2).
# Route (V-5b): drive.ss-sport.co/*, so every request passes the Worker and non-media paths go on to the viewer site.
name = "ss-sport-drive-edge"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# Signed HLS delivery (V-5a). Enable when the HLS renditions bucket exists (I-3), then set the shared key:
#   wrangler secret put HLS_SIGNING_KEY    # the same base64 value as the API's Edge__HlsSigningKey
# [[r2_buckets]]
# binding = "MEDIA"
# bucket_name = "<hls renditions bucket>"
