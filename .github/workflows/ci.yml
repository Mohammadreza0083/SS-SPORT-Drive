# Continuous integration: runs on every pull request and on every push to main.
# Image builds, staging deploy and k6 smoke tests are added in backlog O-2 / O-3 / K-1.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  dotnet:
    name: .NET build, format & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Install ffmpeg (the ingest transcoder tests run the real tool)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Restore
        run: dotnet restore SsSport.Drive.slnx
      - name: Format check
        run: dotnet format SsSport.Drive.slnx --verify-no-changes --no-restore
      - name: Build
        run: dotnet build SsSport.Drive.slnx --configuration Release --no-restore
      - name: Test (unit, architecture, integration with Testcontainers)
        run: dotnet test --solution SsSport.Drive.slnx --configuration Release --no-build

  security:
    # Decisions §1b (O-10): no secrets anywhere in the history, and no dependency with a known vulnerability.
    name: Secret & dependency scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Secret scan (gitleaks, whole history)
        run: >-
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" zricethezav/gitleaks:v8.18.4
          detect --source=/repo --config=/repo/.gitleaks.toml --log-opts="--all" --redact --no-banner
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: .NET vulnerable packages (direct and transitive)
        run: |
          dotnet restore SsSport.Drive.slnx
          dotnet list SsSport.Drive.slnx package --vulnerable --include-transitive | tee vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then exit 1; fi
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - name: npm audit (web, production dependencies)
        working-directory: web
        run: npm audit --omit=dev --audit-level=high
      - name: npm audit (edge worker, production dependencies)
        working-directory: edge
        run: npm audit --omit=dev --audit-level=high

  web:
    name: Web lint, typecheck, tests & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  web-visual:
    name: Web visual tests (Playwright)
    runs-on: ubuntu-latest
    # Same image the baselines are generated in, so fonts and anti-aliasing match.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - run: npm ci
      - run: npm run test:visual
        env:
          CI: "true"
      - name: Upload the report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7

  edge:
    name: Edge typecheck & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: edge
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: edge/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  compose:
    name: Local Docker stack smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Free disk space (the images are large because of ffmpeg, PDFium and ONNX Runtime)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /
      - name: Use the example environment
        run: cp .env.example .env
      - name: Build and start every service
        run: docker compose up --detach --build --wait --wait-timeout 300
      - name: Probe the API and the web app
        run: |
          curl --fail --silent --show-error http://localhost:5080/health/live
          curl --fail --silent --show-error http://localhost:5080/health/ready
          curl --fail --silent --show-error --output /dev/null http://localhost:3000/
      - name: Show logs on failure
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down --volumes
